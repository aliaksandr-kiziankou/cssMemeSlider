<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    <form class="container">
        <input type="radio" name="meme" id="meme1" checked>
        <input type="radio" name="meme" id="meme2">
        <input type="radio" name="meme" id="meme3">
        <input type="radio" name="meme" id="meme4">
        <input type="radio" name="meme" id="meme5">
        <input type="radio" name="meme" id="meme6">
        <input type="radio" name="meme" id="meme7">
        <input type="radio" name="meme" id="meme8">

        <div class="slides">
            <div class="slide slide-1">
                <img src="assets/2007.jpg">
                <p>2007</p>
            </div>
            <div class="slide slide-2">
                <img src="assets/apteka.jpg">
                <p>apteka</p>
            </div>
            <div class="slide slide-3">
                <img src="assets/inter.jpg">
                <p>interstellar</p>
            </div>
            <div class="slide slide-4">
                <img src="assets/no more.jpg">
                <p>no more</p>
            </div>
             <div class="slide slide-5">
                <img src="assets/onion.jpg">
                <p>onion</p>
            </div>
            <div class="slide slide-6">
                <img src="assets/peter.jpg">
                <p>interstellar</p>
            </div>
            <div class="slide slide-7">
                <img src="assets/bathcat.PNG">
                <p>interstellar</p>
            </div>
            <div class="slide slide-8">
                <img src="assets/busted.PNG">
                <p>interstellar</p>
            </div>
        </div>
        
        <div class="btns">
            <label for="meme1"></label>
            <label for="meme2"></label>
            <label for="meme3"></label>
            <label for="meme4"></label>
            <label for="meme5"></label>
            <label for="meme6"></label>
            <label for="meme7"></label>
            <label for="meme8"></label>
        </div>
    </form>
</body>
</html>
