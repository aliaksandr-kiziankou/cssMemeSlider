<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    <form class="container">
        <input type="radio" name="meme" id="meme1" checked>
        <input type="radio" name="meme" id="meme2">
        <input type="radio" name="meme" id="meme3">
        <input type="radio" name="meme" id="meme4">
        <input type="radio" name="meme" id="meme5">
        <input type="radio" name="meme" id="meme6">
        <input type="radio" name="meme" id="meme7">
        <input type="radio" name="meme" id="meme8">
        <input type="radio" name="meme" id="meme9">

        <div class="pics">
            <div class="pic pic-1">
                <img src="assets/2007.png" alt="2007">
            </div>
            <div class="pic pic-2">
                <img src="assets/apteka.png" alt="apteka">
            </div>
            <div class="pic pic-3">
                <img src="assets/inter.png" alt="inter">
            </div>
            <div class="pic pic-4">
                <img src="assets/no-more.png" alt="no more">
            </div>
             <div class="pic pic-5">
                <img src="assets/onion.png" alt="onion">
            </div>
            <div class="pic pic-6">
                <img src="assets/peter.png" alt="peter">
            </div>
            <div class="pic pic-7">
                <img src="assets/bathcat.PNG" alt="bath cat">
            </div>
            <div class="pic pic-8">
                <img src="assets/busted.PNG" alt="busted">
            </div>
            <div class="pic pic-9">
                <img src="assets/hasl.PNG" alt="hasl">
            </div>
        </div>
        
        <div class="under-pics">
            <div class="texts">
                <p class="text text-1">2007</p>
                <p class="text text-2">ночь, улица, камаз, аптека...</p>
                <p class="text text-3">interstellar</p>
                <p class="text text-4">no more</p>
                <p class="text text-5">алло</p>
                <p class="text text-6">тупо я</p>
                <p class="text text-7">простити</p>
                <p class="text text-8">busted</p>
                <p class="text text-9">hasl</p>
            </div>

            <div class="btns">
                <label for="meme1">
                    <span></span>
                </label>
                <label for="meme2">
                    <span></span>
                </label>
                <label for="meme3">
                    <span></span>
                </label>
                <label for="meme4">
                    <span></span>
                </label>
                <label for="meme5">
                    <span></span>
                </label>
                <label for="meme6">
                    <span></span>
                </label>
                <label for="meme7">
                    <span></span>
                </label>
                <label for="meme8">
                    <span></span>
                </label>
                <label for="meme9">
                    <span></span>
                </label>
            </div>
        </div>
    </form>
</body>
</html>
